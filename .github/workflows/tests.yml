name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version the app promises; 3.11 is what the app is
        # developed against, so both are run.
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test tools
        run: python -m pip install --upgrade pip pytest pytest-cov

      - name: Run the API tests
        run: python -m pytest -q --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff and mypy
        run: python -m pip install --upgrade pip ruff mypy

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The Windows app is a script, so reading it is not enough: here cscript
      # runs it, which catches a syntax error before anyone double-clicks it.
      - name: Run the launcher tests
        run: python -m pytest tests/test_windows_launcher.py -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest and Playwright
        run: |
          python -m pip install --upgrade pip pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run the browser tests
        run: python -m pytest tests/e2e -q
        env:
          RUN_E2E: "1"
