name: CI diag

# Throwaway: runs the browser suite on Linux and pushes its output to a scratch
# branch (diag-log-<branch>), because job logs need authentication to read.
on:
  push:
    branches: [ci-diag2]

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest and Playwright
        run: |
          python -m pip install --upgrade pip pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run the browser tests
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          RUN_E2E=1 python -m pytest tests/e2e -q --tb=short -rf > /tmp/log.txt 2>&1 || status=$?
          branch="diag-log-${GITHUB_REF_NAME}"
          rm -rf /tmp/push && mkdir -p /tmp/push && cd /tmp/push
          git init -q .
          cp /tmp/log.txt log.txt
          git checkout -q -b "$branch"
          git add log.txt
          git -c user.email=ci@example.com -c user.name=ci commit -q -m "diag log"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:${branch}"
          exit $status
